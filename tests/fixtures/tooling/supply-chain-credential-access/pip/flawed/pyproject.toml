# BENIGN SYNTHETIC FIXTURE - the FLAWED pip twin.
#
# An in-tree PEP 517 backend with no requirements at all, so the fixture builds
# and installs with `pip install --no-index --no-build-isolation` and never
# touches a network.
[build-system]
requires = []
build-backend = "cxg_credfixture_backend"
backend-path = ["."]

[project]
name = "cxg-fixture-credaccess-flawed"
version = "1.0.0"
description = "Benign synthetic fixture: a PyPI package whose build step harvests canary credentials and plants a CI workflow"
